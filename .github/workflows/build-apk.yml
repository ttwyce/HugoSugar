name: Build APK

# 推送 tag（v*）或手动触发时构建 Android APK。
# 主分支日常推送只跑 analyze/test，不产出安装包，避免浪费额度。
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Install NDK 28.2.13676358
        run: |
          # runner 已预装 Android SDK + cmdline-tools，直接用自带 sdkmanager
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;28.2.13676358"

      - name: Patch build config for x86_64 CI runner
        run: |
          # 本仓库 android/ 的构建配置是为「本地 ARM64 / proot」定制的：
          #   1) gradle.properties 的 android.aapt2FromMavenOverride 指向本地
          #      aarch64 版 aapt2 的绝对路径（/root/Android/...），CI 上不存在；
          #   2) settings.gradle.kts / build.gradle.kts 把阿里云、华为云 Maven
          #      镜像放在最前，境外 runner 访问这些镜像会失败，导致依赖解析不到。
          # GitHub 的 ubuntu runner 是 x86_64 且能直连 google()/mavenCentral()，
          # 所以仅在 CI 运行时临时移除这些定制，不提交回仓库、不影响本地构建。
          sed -i '/aapt2FromMavenOverride/d' android/gradle.properties
          sed -i '/aliyun\.com\|huaweicloud\.com/d' android/settings.gradle.kts
          sed -i '/aliyun\.com\|huaweicloud\.com/d' android/build.gradle.kts
          echo '===== gradle.properties ====='; cat android/gradle.properties
          echo '===== settings.gradle.kts ====='; cat android/settings.gradle.kts
          echo '===== build.gradle.kts ====='; cat android/build.gradle.kts

      - name: flutter pub get
        run: flutter pub get

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # 密钥库不入库，构建时从 Secrets 还原到 runner 临时目录（随 runner 销毁）。
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::未配置 ANDROID_KEYSTORE_BASE64，release 包无法签名"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hugosugar-release.jks"
          chmod 600 "$RUNNER_TEMP/hugosugar-release.jks"
          # 口令错就在这里失败，而不是等 gradle 构建到一半才发现。
          keytool -list -keystore "$RUNNER_TEMP/hugosugar-release.jks" \
            -storepass "$ANDROID_STORE_PASSWORD" > /dev/null
          echo "keystore OK ($(stat -c%s "$RUNNER_TEMP/hugosugar-release.jks") bytes)"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK (release)
        env:
          HUGO_STORE_FILE: ${{ runner.temp }}/hugosugar-release.jks
          HUGO_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          HUGO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HUGO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK signature
        run: |
          # 确认产物真的用的是 release 证书，而不是 debug.keystore。
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk \
            | grep -E "Signer #1 certificate (DN|SHA-256)" | tee /tmp/certs.txt
          grep -q "CN=ttwyce" /tmp/certs.txt || {
            echo "::error::APK 未使用预期的 release 证书签名"
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HugoSugar-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 打 tag 时同时把 APK 附到 GitHub Release
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
